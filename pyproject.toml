[project]
name = "coating-compass"
version = "0.1.0"
description = "An evidence-based coating recommendation assistant grounded in manufacturer documentation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-groq>=1.0,<2",
    "langchain-qdrant>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.0,<2",
    "pypdf>=6.0,<7",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
    "truststore>=0.10,<1",
]
