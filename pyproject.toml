readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-chroma>=1.0,<2",
    "langchain-community>=0.4,<1",
    "langchain-google-genai>=3.0,<5",
    "langchain-groq>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.0,<2",
    "pymupdf>=1.26,<2",
    "python-dotenv>=1.1,<2",
]
