[project]
name = "coating-compass"
version = "0.1.0"
description = "An evidence-based coating recommendation assistant grounded in manufacturer documentation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "deepeval>=3,<4",
    "langchain>=1.0,<2",
    "langchain-classic>=1.0,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-groq>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-qdrant>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langfuse>=4.15.6",
    "langgraph>=1.0,<2",
    "pypdf>=6.0,<7",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "python-dotenv>=1.1,<2",
    "rank-bm25>=0.2.2,<0.3",
    "truststore>=0.10,<1",
    "langchain-cohere>=0.5,<0.6",
]
